<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GTA VI Companion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#ff2975; --purple:#9b30d9; --teal:#00e5c7; --sun:#ffb347;
  --gold:#ffd34d; --epic:#c77dff; --cash:#3dff7c; --bg:#0d0518; --card:#1a0b2e; --card2:#241040;
  --txt:#f5eefc; --dim:#b9a8d9; --red:#ff4d5e;
}
html,body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Roboto,Arial,sans-serif;width:240px;margin:0 auto}
body{min-height:282px;background:linear-gradient(180deg,#2b0a4a 0%,#0d0518 30%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}

/* ---------- header / hero ---------- */
.hero{position:relative;padding:10px 8px 8px;text-align:center;background:
  radial-gradient(120px 60px at 50% -10px, rgba(255,179,71,.85), rgba(255,41,117,.35) 55%, transparent 75%),
  linear-gradient(180deg,#57126e 0%,#2b0a4a 70%,transparent);}
.hero .gta{font-family:Impact,'Arial Black',sans-serif;font-size:15px;letter-spacing:2.5px;color:#fff;text-shadow:0 2px 0 #000,0 0 12px rgba(255,41,117,.8)}
.hero .vi{font-family:Impact,'Arial Black',sans-serif;font-size:64px;line-height:.95;
  background:linear-gradient(180deg,#ffe259 5%,#ff7518 30%,#ff2975 55%,#9b30d9 80%,#00e5c7 105%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.85)) drop-shadow(0 0 14px rgba(155,48,217,.55))}
.hero .sub{font-size:10px;letter-spacing:3px;color:var(--teal);font-weight:700;margin-top:1px}
.hero .upd{font-size:8.5px;color:var(--dim);margin-top:4px}
.palms{font-size:13px;letter-spacing:8px;opacity:.85}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(13,5,24,.96);border-bottom:1px solid #3a1a5e}
.topbar .back{font-size:17px;color:var(--teal);padding:2px 6px 2px 0}
.topbar .ttl{font-family:Impact,'Arial Black',sans-serif;font-size:14px;letter-spacing:1.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl em{font-style:normal;color:var(--pink)}
.searchbar{padding:6px 8px 2px}
.searchbar input{width:100%;padding:7px 9px;border-radius:9px;border:1px solid #4a2680;background:#170a2c;color:#fff;font-size:12px;outline:none}
.searchbar input:focus{border-color:var(--pink)}

/* ---------- menu ---------- */
.menu{padding:8px}
.mbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:12px 11px;margin-bottom:8px;border-radius:13px;color:#fff;
  background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid #4a2680;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.mbtn:active{transform:scale(.98)}
.mbtn .ic{font-size:24px}
.mbtn .t{font-family:Impact,'Arial Black',sans-serif;font-size:16px;letter-spacing:1.2px}
.mbtn .d{font-size:10px;color:var(--dim);margin-top:1px}
.mbtn .n{margin-left:auto;font-size:10px;font-weight:800;color:#0d0518;background:var(--teal);border-radius:20px;padding:2px 7px}
.mbtn.loot{border-color:#8a6d1f}.mbtn.eggs{border-color:#1f7a6d}.mbtn.story{border-color:#7a1f56}.mbtn.cars{border-color:#1f4d8a}.mbtn.mapb{border-color:#6d1f8a}
.secbox{background:#170a2c;border:1px solid #4a2680;border-radius:10px;padding:7px 9px}
.secbox .srow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3.5px 0;border-bottom:1px solid #2a1247}
.secbox .srow:last-child{border-bottom:none}
.secbox .sk{color:var(--dim)}.secbox .sv{font-weight:800;text-align:right}
.sv.ok{color:var(--cash)}.sv.bad{color:#ff9aa4}.sv.unk{color:#ffd88a}
.regbanner{border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800;text-align:center;margin:8px 10px 0;letter-spacing:.4px}
.regbanner.ok{background:rgba(61,255,124,.13);border:1px solid var(--cash);color:var(--cash)}
.regbanner.bad{background:rgba(255,77,94,.13);border:1px solid var(--red);color:#ff9aa4}
.regbanner.unk{background:rgba(255,211,77,.1);border:1px solid #b97e1e;color:#ffd88a}
.mapwrap{position:relative;height:242px;overflow:hidden;background:#0a0618;border:1px solid #4a2680;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.maplayer{position:absolute;left:0;top:0;width:240px;height:327px;transform-origin:0 0;will-change:transform;transition:transform .18s ease-out}
.maplayer.drag{transition:none}
.mappin.custom{background:#37e0ff;border-color:#0b5a6e}
.maplayer img{width:240px;height:327px;display:block;pointer-events:none}
.mappin{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#ffd34d;border:2px solid #7a4d00;box-shadow:0 0 5px rgba(0,0,0,.7);cursor:pointer;z-index:2}
.mappin.main{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;background:var(--pink);border-color:#fff;z-index:3;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,41,117,.55)}70%{box-shadow:0 0 0 13px rgba(255,41,117,0)}100%{box-shadow:0 0 0 0 rgba(255,41,117,0)}}
.mapctl{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:5px;z-index:5}
.mapctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(20,8,43,.92);color:var(--txt);font-size:15px;font-weight:800}
.mapcard{background:#170a2c;border:1px solid #4a2680;border-radius:10px;padding:8px 10px;margin-top:7px}
.mapcard .mn{font-size:13px;font-weight:800}
.mapcard .ma{font-size:11px;color:var(--teal)}
.mapcard .open{margin-top:6px;width:100%;background:var(--teal);color:#04231d;border:none;border-radius:8px;padding:7px;font-weight:800;font-size:12px}
.r1focus{outline:2px solid var(--teal)!important;outline-offset:1px;box-shadow:0 0 0 3px rgba(45,226,196,.35)!important}
.progwrap{margin:2px 8px 8px;padding:8px 10px;background:var(--card);border:1px solid #3a1a5e;border-radius:11px}
.progwrap .pl{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}
.progbar{height:7px;border-radius:5px;background:#0d0518;margin-top:5px;overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--teal));border-radius:5px}
.nextup{margin:0 8px 10px;padding:8px 10px;border:1px dashed var(--gold);border-radius:11px;background:rgba(255,211,77,.07);font-size:11px}
.nextup b{color:var(--gold)}

/* ---------- cards ---------- */
.list{padding:6px 8px 14px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid #3d1c66;border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.card:active{border-color:var(--pink)}
.card .thumb{width:100%;height:86px;object-fit:cover;background:#0a0313}
.card .noimg{height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#3a1052,#14062a)}
.card .cb{padding:7px 9px 8px}
.card .nm{font-size:13px;font-weight:800;line-height:1.25}
.card .ar{font-size:10px;color:var(--teal);margin-top:1px}
.lootline{font-size:11px;margin-top:4px;line-height:1.45}
.r-legendary{color:var(--gold);font-weight:800;text-shadow:0 0 7px rgba(255,211,77,.85)}
.r-epic{color:var(--epic);font-weight:800;text-shadow:0 0 7px rgba(199,125,255,.8)}
.r-cash{color:var(--cash);font-weight:800;text-shadow:0 0 6px rgba(61,255,124,.65)}
.r-sellable{color:var(--cash);font-weight:700}
.r-vehicle{color:#7cc7ff;font-weight:700}
.r-other{color:#e8ddf7;font-weight:700}
.badges{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.bdg{font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:20px;background:#0d0518;border:1px solid #4a2680;color:var(--dim)}
.bdg.g-high{border-color:var(--red);color:#ff9aa4}.bdg.g-med{border-color:#b97e1e;color:#ffd88a}.bdg.g-low{border-color:#2e7d4f;color:#8affb0}
.bdg.miss{border-color:var(--red);color:#fff;background:rgba(255,77,94,.25)}
.bdg.done{border-color:var(--cash);color:var(--cash)}
.filtrow{display:flex;gap:5px;padding:6px 8px 0;flex-wrap:wrap}
.fchip{font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;border:1px solid #4a2680;color:var(--dim);background:#170a2c}
.fchip.on{color:#0d0518;background:var(--teal);border-color:var(--teal)}

/* ---------- detail ---------- */
.detail{padding:0 0 16px}
.detail .photo{width:100%;max-height:170px;object-fit:cover;background:#0a0313}
.dsec{padding:8px 10px 0}
.dsec h3{font-family:Impact,'Arial Black',sans-serif;font-size:12.5px;letter-spacing:1.4px;color:var(--pink);margin-bottom:4px}
.dsec p,.dsec li{font-size:11.5px;line-height:1.5;color:#efe8fb}
.dsec ul,.dsec ol{padding-left:16px}
.dsec li{margin-bottom:3px}
.lootrow{display:flex;gap:7px;align-items:center;background:#170a2c;border:1px solid #3a1a5e;border-radius:9px;padding:6px 8px;margin-bottom:5px}
.lootrow img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.lootrow .ln{font-size:12px}
.lootrow .ld{font-size:10px;color:var(--dim)}
.warn{background:rgba(255,77,94,.14);border:1px solid var(--red);border-radius:9px;padding:7px 9px;font-size:11px;margin:8px 10px 0;line-height:1.45}
.note{background:rgba(0,229,199,.08);border:1px solid #1f7a6d;border-radius:9px;padding:7px 9px;font-size:11px;margin:8px 10px 0;line-height:1.45}
.tabs{display:flex;gap:6px;padding:10px 10px 0}
.tab{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-family:Impact,'Arial Black',sans-serif;font-size:12px;letter-spacing:1px;background:#170a2c;border:1px solid #4a2680;color:var(--dim)}
.tab.on{color:#0d0518;background:linear-gradient(90deg,var(--sun),var(--pink));border-color:transparent}
.findit .mapimg{width:100%;border-radius:10px;border:1px solid #4a2680;margin-bottom:6px}
.bigbtn{display:block;width:calc(100% - 20px);margin:12px 10px 0;padding:11px;border-radius:11px;text-align:center;
  font-family:Impact,'Arial Black',sans-serif;font-size:14px;letter-spacing:1.2px;color:#0d0518;background:linear-gradient(90deg,var(--teal),#5df2ff)}
.bigbtn.found{background:linear-gradient(90deg,#1d5c38,var(--cash));color:#04140a}
.srcs{padding:8px 10px 0;font-size:9px;color:#7d6ba3;line-height:1.5;word-break:break-all}
.kv{font-size:11.5px;line-height:1.55}.kv b{color:var(--teal)}
.reward-big{font-size:15px;font-weight:800;color:var(--cash);text-shadow:0 0 8px rgba(61,255,124,.5)}
.reward-none{font-size:11.5px;color:#ffd88a}

/* ---------- missions ---------- */
.chap{margin:6px 8px 0;border:1px solid #3d1c66;border-radius:12px;overflow:hidden;background:var(--card)}
.chaphead{width:100%;display:flex;align-items:center;gap:7px;text-align:left;padding:10px;background:linear-gradient(135deg,var(--card2),transparent)}
.chaphead .ct{font-family:Impact,'Arial Black',sans-serif;font-size:13.5px;letter-spacing:1px;flex:1}
.chaphead .cn{font-size:9.5px;color:var(--dim)}
.chaphead .arr{color:var(--teal);font-size:13px}
.mrow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:8px 10px;border-top:1px solid #2a1247;font-size:12px}
.mrow .no{color:var(--dim);font-size:10px;width:20px;flex:none}
.mrow .mn{flex:1;font-weight:600;line-height:1.3}
.mrow .chk{flex:none;width:19px;height:19px;border-radius:6px;border:1.5px solid #4a2680;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--cash)}
.mrow.isdone .mn{color:var(--dim);text-decoration:line-through}
.mrow.next{ background:rgba(255,211,77,.08)}
.mrow.next .mn{color:var(--gold)}
.foot{padding:10px;text-align:center;font-size:9px;color:#7d6ba3;line-height:1.6}
.hidden{display:none!important}
.empty{padding:22px 12px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var DATA=null, LS='gtavi-companion-v1';
var state={screen:'home',lootFilter:'all',eggFilter:'all',openChap:1,detail:null,detailTab:'info',query:''};
var store={done:{},found:{}};
try{var s=localStorage.getItem(LS); if(s) store=JSON.parse(s);}catch(e){}
if(!store.cmarks) store.cmarks=[];
function save(){try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function $(id){return document.getElementById(id);}
function rarityClass(r){return 'r-'+(r||'other');}
function glowLoot(l){return '<span class="'+rarityClass(l.rarity)+'">'+esc(l.name)+'</span>';}

/* ---------- boot: remote data.json (auto-updates from GitHub), cache fallback ---------- */
function boot(data,fromCache){
  DATA=data;
  if(!fromCache){try{localStorage.setItem(LS+'-data',JSON.stringify(data));}catch(e){}}
  render();
}
fetch('data.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){boot(d,false);})
.catch(function(){
  try{var c=localStorage.getItem(LS+'-data'); if(c){boot(JSON.parse(c),true);return;}}catch(e){}
  $('app').innerHTML='<div class="empty">Could not load data.<br>Check connection and reopen.</div>';
});

/* ---------- navigation ---------- */
function go(screen,detail){state.screen=screen;state.detail=detail||null;state.detailTab='info';window.scrollTo(0,0);render();}
function back(){ if(state.detail){state.detail=null;render();window.scrollTo(0,0);} else go('home'); }

function topbar(title){
  return '<div class="topbar"><button class="back" onclick="back()">&#9664;</button><div class="ttl">'+title+'</div></div>';
}
function searchbar(ph){
  return '<div class="searchbar"><input id="q" type="text" placeholder="'+ph+'" value="'+esc(state.query)+'" oninput="state.query=this.value;renderList()"></div>';
}

/* ---------- home ---------- */
function counts(){
  var m=DATA.missions.length, md=DATA.missions.filter(function(x){return store.done['m'+x.overall_number];}).length;
  var l=DATA.loot.length, lf=DATA.loot.filter(function(x){return store.found['l'+x.id];}).length;
  var e=DATA.eggs.length, ef=DATA.eggs.filter(function(x){return store.found['e'+x.id];}).length;
  var v=(DATA.vehicles||[]).length, vf=(DATA.vehicles||[]).filter(function(x){return store.found['v'+x.id];}).length;
  return {m:m,md:md,l:l,lf:lf,e:e,ef:ef,v:v,vf:vf,pct:Math.round(((md+lf+ef+vf)/(m+l+e+v))*100)||0};
}
function nextMission(){ for(var i=0;i<DATA.missions.length;i++){ if(!store.done['m'+DATA.missions[i].overall_number]) return DATA.missions[i]; } return null; }
function renderHome(){
  var c=counts(), nx=nextMission();
  var h='<div class="hero"><div class="palms">&#127796; &#127796; &#127796;</div><div class="gta">GRAND THEFT AUTO</div><div class="vi">VI</div><div class="sub">LEONIDA COMPANION</div><div class="upd">Data updated '+esc(DATA.updated)+' &middot; v'+esc(DATA.version)+'</div></div>';
  h+='<div class="progwrap"><div class="pl"><span>Overall completion</span><b>'+c.pct+'%</b></div><div class="progbar"><i style="width:'+c.pct+'%"></i></div></div>';
  if(nx) h+='<div class="nextup">&#9654; <b>Up next:</b> Ch.'+nx.chapter+' &middot; '+esc(nx.name)+'</div>';
  h+='<div class="menu">';
  h+='<button class="mbtn loot" onclick="go(\'loot\')"><span class="ic">&#128176;</span><span><div class="t">HIDDEN LOOT</div><div class="d">Illegal ops, stash houses, unique weapons</div></span><span class="n">'+c.lf+'/'+c.l+'</span></button>';
  h+='<button class="mbtn mapb" onclick="go(\'map\')"><span class="ic">&#128506;</span><span><div class="t">LEONIDA MAP</div><div class="d">Full dynamic map: every loot pin, pan &amp; zoom, your own markers</div></span><span class="n">37 PINS</span></button>';
  h+='<button class="mbtn eggs" onclick="go(\'eggs\')"><span class="ic">&#129370;</span><span><div class="t">EASTER EGGS</div><div class="d">Secrets, sightings &amp; hidden scenes</div></span><span class="n">'+c.ef+'/'+c.e+'</span></button>';
  h+='<button class="mbtn cars" onclick="go(\'vehicles\')"><span class="ic">&#128663;</span><span><div class="t">SPECIAL VEHICLES</div><div class="d">Hidden cars &amp; their security: register or joyride?</div></span><span class="n">'+c.vf+'/'+c.v+'</span></button>';
  h+='<button class="mbtn story" onclick="go(\'story\')"><span class="ic">&#127902;</span><span><div class="t">STORY PROGRESSION</div><div class="d">Every main mission, in order, by chapter</div></span><span class="n">'+c.md+'/'+c.m+'</span></button>';
  h+='<button class="bigbtn" style="background:#241040" onclick="toggleSnd()">'+(store.snd===false?'&#128263; MENU SOUNDS: OFF':'&#128266; MENU SOUNDS: ON')+'</button>';
  h+='</div><div class="foot">Unofficial fan companion. Loot &amp; mission data cross-checked across multiple guides; anything not verified is labelled in its entry.<br>New finds are added by data update — no reinstall needed.</div>';
  $('app').innerHTML=h;
}
/* ---------- shared bits ---------- */
function stepsHtml(d){
  if(!d) return '';
  var parts = Array.isArray(d) ? d : String(d).split(/(?=\b\d+\)\s)/).map(function(s){return s.trim();}).filter(Boolean);
  if(parts.length>1) return '<ol>'+parts.map(function(s){return '<li>'+esc(s.replace(/^\d+\)\s*/,''))+'</li>';}).join('')+'</ol>';
  return '<p>'+esc(d)+'</p>';
}
function srcsHtml(list){
  if(!list||!list.length) return '';
  return '<div class="srcs">Sources: '+list.map(function(u){return esc(u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]);}).join(' &middot; ')+'</div>';
}
function guardBadge(g){
  if(!g) return '';
  var cls = g.level==='high'?'g-high':(g.level==='medium'||g.level==='med')?'g-med':'g-low';
  return '<span class="bdg '+cls+'">&#128737; Guards: '+esc(g.level)+'</span>';
}
function imgsOf(entry,kind){
  var li=entry.local_images;
  if(li){ if(Array.isArray(li)&&li.length) return li; if(li[kind]&&li[kind].length) return li[kind]; }
  return [];
}
function allImgs(entry){
  var li=entry.local_images, out=[];
  if(li){ if(Array.isArray(li)) return li; ['location','map','loot'].forEach(function(k){(li[k]||[]).forEach(function(u){out.push(u);});}); return out; }
  if(Array.isArray(entry.image_urls)) return entry.image_urls.filter(function(u){return u.indexOf('assets/')===0;});
  return [];
}
function mapImgs(entry){
  var li=entry.local_images;
  if(li&&!Array.isArray(li)&&li.map&&li.map.length) return li.map;
  var all=allImgs(entry);
  return all.filter(function(u){return /map/i.test(u);});
}
function locImgs(entry){
  var m=mapImgs(entry), all=allImgs(entry);
  var rest=all.filter(function(u){return m.indexOf(u)<0;});
  return rest.length?rest:all;
}

/* ---------- LOOT ---------- */
function lootMatches(e){
  if(state.lootFilter==='legendary' && !e.loot.some(function(l){return l.rarity==='legendary';})) return false;
  if(state.lootFilter==='chapter1' && !/chapter 1/i.test(e.chapter_available||'')) return false;
  if(state.lootFilter==='todo' && store.found['l'+e.id]) return false;
  if(state.query){ var q=state.query.toLowerCase(), hay=(e.name+' '+e.area+' '+e.loot.map(function(l){return l.name;}).join(' ')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
  return true;
}
function lootCard(e){
  var im=allImgs(e), found=!!store.found['l'+e.id];
  var h='<div class="card" onclick="openLoot(\''+e.id+'\')">';
  h+= im.length? '<img class="thumb" loading="lazy" src="'+esc(im[0])+'" alt="">' : '<div class="noimg">&#128176;</div>';
  h+='<div class="cb"><div class="nm">'+esc(e.name.replace(/\s*\(.*Operation\)/,''))+'</div><div class="ar">&#128205; '+esc(e.area)+'</div>';
  h+='<div class="lootline">'+e.loot.slice(0,3).map(glowLoot).join(' &middot; ')+'</div>';
  if(e.cash_estimate) h+='<div class="lootline"><span class="r-cash">'+esc(e.cash_estimate.split('.')[0].split('—')[0].slice(0,90))+'</span></div>';
  h+='<div class="badges">'+guardBadge(e.guards)+(e.missable?'<span class="bdg miss">&#9888; MISSABLE</span>':'')+(found?'<span class="bdg done">&#10003; LOOTED</span>':'')+'</div>';
  return h+'</div></div>';
}
function renderLoot(){

/* ---------- INTEGRATED MAP ---------- */
var PENDMAP=null;
var MAPW=240, MAPH=242, LAYW=240, LAYH=327;
var mapView={s:1,tx:0,ty:0};
var mapSel=null, mapFocusId=null, mapDrag=null;
function pinXY(c){ return {x:c.x/1000*LAYW, y:c.y/1000*LAYH}; }
function clampMap(){ var w=LAYW*mapView.s, h=LAYH*mapView.s;
  mapView.tx = w<=MAPW ? (MAPW-w)/2 : Math.min(0, Math.max(MAPW-w, mapView.tx));
  mapView.ty = h<=MAPH ? (MAPH-h)/2 : Math.min(0, Math.max(MAPH-h, mapView.ty)); }
function applyMap(){ var l=document.getElementById('maplayer'); if(l) l.style.transform='translate('+mapView.tx+'px,'+mapView.ty+'px) scale('+mapView.s+')'; }
function centerMap(c,s){ mapView.s=s; var p=pinXY(c); mapView.tx=MAPW/2-p.x*s; mapView.ty=MAPH/2-p.y*s; clampMap(); applyMap(); }
function zoomMap(f){ var ns=Math.min(6,Math.max(0.9,mapView.s*f)), k=ns/mapView.s; mapView.tx=MAPW/2-(MAPW/2-mapView.tx)*k; mapView.ty=MAPH/2-(MAPH/2-mapView.ty)*k; mapView.s=ns; clampMap(); applyMap(); }
function resetMap(){ if(mapFocusId){ var e=DATA.loot.filter(function(x){return x.id===mapFocusId;})[0]; if(e&&e.coords){ centerMap(e.coords,3); return; } } centerMap({x:500,y:500},MAPH/LAYH); }
function mapHtml(focusId){
  var pins=DATA.loot.filter(function(e){return e.coords;}).map(function(e){ var p=pinXY(e.coords); return '<div class="mappin'+(e.id===focusId?' main':'')+'" style="left:'+p.x+'px;top:'+p.y+'px" onclick="pinTap(event,\''+e.id+'\')"></div>'; }).join('');
  pins+=(store.cmarks||[]).map(function(m){ var p=pinXY(m); return '<div class="mappin custom" style="left:'+p.x+'px;top:'+p.y+'px" onclick="pinTap(event,\''+m.id+'\')"></div>'; }).join('');
  return '<div class="mapwrap" id="mapwrap"><div class="maplayer" id="maplayer"><img src="assets/map-full.jpg" alt="Leonida map">'+pins+'</div><div class="mapctl"><button onclick="zoomMap(1.4)">+</button><button onclick="zoomMap(0.7)">&minus;</button><button onclick="resetMap()">&#10227;</button><button onclick="addCMark()" title="Add my marker at center">&#xff0b;</button></div></div>';
}
function addCMark(){ var lx=(MAPW/2-mapView.tx)/mapView.s, ly=(MAPH/2-mapView.ty)/mapView.s;
  var m={id:'c'+Date.now(), x:Math.round(lx/LAYW*1000), y:Math.round(ly/LAYH*1000), label:'My marker '+((store.cmarks||[]).length+1)};
  store.cmarks.push(m); save(); mapSel=m.id; render(); setTimeout(function(){ var c=document.getElementById('mapcard'); if(c) c.innerHTML=cmarkCard(m); },30); }
function delCMark(id){ store.cmarks=(store.cmarks||[]).filter(function(m){return m.id!==id;}); save(); mapSel=null; render(); }
function cmarkCard(m){ return '<div class="mapcard"><div class="mn" style="color:#37e0ff">&#128205; '+esc(m.label)+' (your marker)</div><div class="ma">Saved on this device — shows on every map in the app</div><button class="open" style="background:#ff4d6d;color:#fff" onclick="delCMark(\''+m.id+'\')">DELETE THIS MARKER</button></div>'; }
function mapCardHtml(e,isFocus){
  var top=e.loot&&e.loot[0]?e.loot[0].name:'';
  var h='<div class="mapcard"><div class="mn">&#128205; '+esc(e.name)+'</div><div class="ma">'+esc(e.area)+(e.coords&&e.coords.approx?' &middot; pin approximate':'')+'</div>';
  if(top) h+='<div style="font-size:11.5px;margin-top:3px">Top loot: <b>'+esc(top)+'</b></div>';
  h+='<p style="font-size:11.5px;margin-top:4px">'+esc(String(e.map_description||'').slice(0,220))+'</p>';
  if(!isFocus) h+='<button class="open" onclick="openLoot(\''+e.id+'\')">OPEN THIS SPOT</button>';
  else h+='<div style="font-size:10.5px;color:var(--dim);margin-top:4px">This is the spot you are viewing — full directions below.</div>';
  return h+'</div>';
}
function pinTap(ev,id){ ev.stopPropagation(); if(mapDrag&&mapDrag.moved>6) return;
  if(id.charAt(0)==='c' && id.length>10){ var m=(store.cmarks||[]).filter(function(x){return x.id===id;})[0]; if(!m) return; mapSel=id; var cc=document.getElementById('mapcard'); if(cc) cc.innerHTML=cmarkCard(m); return; }
  var e=DATA.loot.filter(function(x){return x.id===id;})[0]; if(!e) return;
  if(mapSel===id && id!==mapFocusId){ openLoot(id); return; }
  mapSel=id; var c=document.getElementById('mapcard'); if(c) c.innerHTML=mapCardHtml(e, id===mapFocusId); }
function initMapDrag(){ var w=document.getElementById('mapwrap'); if(!w) return;
  var layer=document.getElementById('maplayer'), raf=0;
  function start(x,y){ mapDrag={x:x,y:y,tx:mapView.tx,ty:mapView.ty,moved:0}; if(layer) layer.classList.add('drag'); }
  function move(x,y){ if(!mapDrag) return; var dx=x-mapDrag.x, dy=y-mapDrag.y; mapDrag.moved=Math.max(mapDrag.moved,Math.abs(dx)+Math.abs(dy)); mapView.tx=mapDrag.tx+dx; mapView.ty=mapDrag.ty+dy; clampMap();
    if(!raf) raf=requestAnimationFrame(function(){ raf=0; applyMap(); }); }
  function end(){ if(layer) layer.classList.remove('drag'); setTimeout(function(){ mapDrag=null; },60); }
  w.addEventListener('pointerdown',function(ev){ start(ev.clientX,ev.clientY); });
  w.addEventListener('pointermove',function(ev){ move(ev.clientX,ev.clientY); });
  w.addEventListener('pointerup',end); w.addEventListener('pointercancel',end); w.addEventListener('pointerleave',end);
  w.addEventListener('touchstart',function(ev){ if(ev.touches.length===1) start(ev.touches[0].clientX,ev.touches[0].clientY); },{passive:true});
  w.addEventListener('touchmove',function(ev){ if(ev.touches.length===1){ move(ev.touches[0].clientX,ev.touches[0].clientY); ev.preventDefault(); } },{passive:false});
  w.addEventListener('touchend',end);
  w.addEventListener('dblclick',function(){ zoomMap(1.6); });
}
function maybeInitMap(){ if(!PENDMAP) return; var p=PENDMAP; PENDMAP=null; mapFocusId=p.id||null; mapSel=p.id||null; initMapDrag();
  if(p.mode==='focus') centerMap(p.coords,3); else centerMap({x:500,y:500},MAPH/LAYH); }
function renderMapOverview(){
  PENDMAP={mode:'fit'};
  var h=topbar('LEONIDA <em>MAP</em>');
  h+='<div class="detail"><div class="dsec"><h3>&#128506; ALL HIDDEN LOOT — '+DATA.loot.filter(function(e){return e.coords;}).length+' PINS</h3>'+mapHtml(null);
  h+='<div id="mapcard"><div class="mapcard"><div class="mn">Tap any gold pin</div><p style="font-size:11.5px;margin-top:3px">Every gold pin is a loot spot. Tap once to preview it, tap again (or OPEN) to jump to its full card with directions. Drag to pan, + / &minus; or double-tap to zoom. The <b>&#xff0b;</b> button drops <b>your own cyan marker</b> at the center of the view — saved on this device, shown on every map, tap it to delete it.</p></div></div>';
  h+='<p style="margin-top:6px;font-size:11px;color:var(--dim)">Map: community base map via gta6map.io. Pins matched from that map\'s own markers; 8 pins placed from written descriptions are marked approximate on their cards.</p></div></div>';
  $('app').innerHTML=h; maybeInitMap();
}

/* ---------- render dispatch ---------- */
function renderList(){
  var w=$('listwrap'); if(!w) return;
  if(state.screen==='loot'){ var list=DATA.loot.filter(lootMatches); w.innerHTML=list.length?list.map(lootCard).join(''):'<div class="empty">No loot matches.</div>'; }
  else if(state.screen==='eggs'){ var list2=DATA.eggs.filter(eggMatches); w.innerHTML=list2.length?list2.map(eggCard).join(''):'<div class="empty">No easter eggs match.</div>'; }
  else if(state.screen==='story'){ w.innerHTML=storyHtml(); }
  else if(state.screen==='vehicles'){ var list3=(DATA.vehicles||[]).filter(vehicleMatches); w.innerHTML=list3.length?list3.map(vehicleCard).join(''):'<div class="empty">No vehicles match.</div>'; }
}
function render(){
  if(!DATA) return;
  if(state.detail){
    if(state.detail.type==='loot'){ var e=DATA.loot.filter(function(x){return x.id===state.detail.id;})[0]; if(e){PENDMAP=null; $('app').innerHTML=lootDetail(e); maybeInitMap(); return;} }
    if(state.detail.type==='egg'){ var g=DATA.eggs.filter(function(x){return x.id===state.detail.id;})[0]; if(g){$('app').innerHTML=eggDetail(g); return;} }
    if(state.detail.type==='mission'){ var m=DATA.missions.filter(function(x){return x.overall_number===state.detail.id;})[0]; if(m){$('app').innerHTML=missionDetail(m); return;} }
    if(state.detail.type==='vehicle'){ var vh=(DATA.vehicles||[]).filter(function(x){return x.id===state.detail.id;})[0]; if(vh){$('app').innerHTML=vehicleDetail(vh); return;} }
    state.detail=null;
  }
  if(state.screen==='home') renderHome();
  else if(state.screen==='loot') renderLoot();
  else if(state.screen==='eggs') renderEggs();
  else if(state.screen==='story') renderStory();
  else if(state.screen==='vehicles') renderVehicles();
  else if(state.screen==='map') renderMapOverview();
}

/* ---------- SOUND: classic menu blips, synthesized live (no audio files) ---------- */
var AC=null;
function ac(){ if(store.snd===false) return null; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function blip(f0,f1,dur,vol){ var c=ac(); if(!c) return; var t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type='square'; o.frequency.setValueAtTime(f0,t); if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03); }
function sndTick(){ blip(640,540,0.045,0.03); }
function sndSelect(){ blip(500,880,0.095,0.05); }
function sndBack(){ blip(430,215,0.095,0.045); }
function toggleSnd(){ store.snd=(store.snd===false); save(); if(store.snd) sndSelect(); render(); }

/* ---------- R1 HARDWARE CONTROLS: scroll wheel = move/scroll, side button = select ---------- */
var r1Idx=0;
function r1Focusables(){ return Array.prototype.slice.call(document.querySelectorAll('button, input, [onclick]')).filter(function(el){ return el.offsetParent!==null; }); }
function r1Highlight(scroll){ var f=r1Focusables(); document.querySelectorAll('.r1focus').forEach(function(el){el.classList.remove('r1focus');});
  if(!f.length) return; if(r1Idx<0) r1Idx=0; if(r1Idx>=f.length) r1Idx=f.length-1;
  var el=f[r1Idx]; el.classList.add('r1focus'); if(scroll!==false && el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
function r1InitFocus(){ r1Idx=0; r1Highlight(false); }
function r1Move(dir){ if(document.getElementById('mapwrap')){ zoomMap(dir>0?1.3:0.77); sndTick(); return; }
  var f=r1Focusables(); if(!f.length) return; r1Idx=(r1Idx+dir+f.length)%f.length; r1Highlight(true); sndTick(); }
function r1Select(){ if(document.getElementById('mapwrap')){ if(mapSel && mapSel!==mapFocusId && mapSel.charAt(0)!=='c'){ openLoot(mapSel); } return; }
  var f=r1Focusables(); if(f[r1Idx]) f[r1Idx].click(); }
document.addEventListener('keydown',function(ev){
  var k=ev.key||'', code=ev.keyCode||ev.which||0;
  var ae=document.activeElement, inInput=ae&&ae.tagName==='INPUT';
  if(k==='ArrowDown'||code===40){ ev.preventDefault(); r1Move(1); }
  else if(k==='ArrowUp'||code===38){ ev.preventDefault(); r1Move(-1); }
  else if(k==='Enter'||k===' '||k==='Spacebar'||code===13||k==='Power'||code===116||k==='MediaPlayPause'){
    if(inInput){ ae.blur(); return; }
    ev.preventDefault(); r1Select(); }
});
window.addEventListener('wheel',function(ev){ if(ev.deltaY!==0) r1Move(ev.deltaY>0?1:-1); },{passive:true});
document.addEventListener('click',function(ev){ var t=ev.target&&ev.target.closest?ev.target.closest('button, input, [onclick]'):null; if(!t) return;
  if(t.classList&&t.classList.contains('back')) sndBack(); else if(t.tagName!=='INPUT') sndSelect();
  var f=r1Focusables(), i=f.indexOf(t); if(i>=0){ r1Idx=i; r1Highlight(false); } },true);
var _r1Render=render;
render=function(){ _r1Render(); setTimeout(r1InitFocus,0); };
</script>
